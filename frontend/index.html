<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dht22</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/beercss@3/dist/cdn/beer.min.css">
    <link rel="stylesheet" href="/style.css">

    <script type="module" src="app.js"></script>
</head>

<body>
    <main class="responsive">
        <h3>ESP32 DHT22 Monitor</h3>

        <!-- Device management bar -->
        <div class="manage-bar">
            <div class="manage-inputs">
                <input id="ipInput" class="input" type="text" placeholder=" 设备 IP">
                <input id="nameInput" class="input" type="text" placeholder=" 名称（可选）">
            </div>
            <button id="addBtn" class="btn primary">＋ 添加</button>
        </div>

        <!-- Device cards grid -->
        <div id="deviceGrid" class="device-grid"></div>

        <!-- Empty state -->
        <div id="emptyState" class="empty-state" style="display:none">
            <p>还没有添加设备，在上方输入 IP 后点击 "添加"。</p>
        </div>

        <!-- Local time footer (independent) -->
        <footer class="local-time">
            <span class="label">🖥 本地时间</span>
            <span id="localTime">--</span>
        </footer>
    </main>
</body>

</html>
