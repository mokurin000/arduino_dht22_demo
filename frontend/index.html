<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dht22</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flexboxgrid/6.3.1/flexboxgrid.min.css">

    <script type="module" src="app.js"></script>
</head>

<body>
    <main class="container">

        <p>
            <span style="font-weight: 700">ESP32 DHT22 Monitor</span> - <span id="localTime">--</span>
        </p>

        <!-- Device management bar -->
        <div class="row">
            <div class="col-xs-12 col-md-4">
                <input id="ipInput" type="text" placeholder="设备 IP">
            </div>
            <div class="col-xs-12 col-md-4">
                <input id="nameInput" type="text" placeholder="名称（可选）">
            </div>
            <div class="col-xs-12 col-md-4">
                <button id="addBtn" class="btn">＋ 添加</button>
            </div>
        </div>

        <!-- Device cards container (rows are built by JS) -->
        <div id="deviceGrid"></div>

        <!-- Empty state -->
        <div id="emptyState" style="display:none;text-align:center;margin-block:3rem;opacity:0.5">
            <p>还没有添加设备，在上方输入 IP 后点击 "添加"。</p>
        </div>
    </main>
</body>

</html>
